<!DOCTYPE html>
<html>
<head>
    <title>Picker API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-case { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .dynamic { color: blue; }
    </style>
</head>
<body>
    <h1>🧪 Picker API Test - Dynamic Values</h1>
    <p>Testing if the picker API now returns dynamic emotional alignment and stake amounts instead of hardcoded 80% and $30.</p>
    
    <div id="test-results"></div>

    <script>
        async function testPickerAPI() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<p>Testing Picker API...</p>';

            try {
                const response = await fetch('/api/picker/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sport: 'basketball_nba',
                        riskTolerance: 'moderate',
                        weeklyBudget: 500,
                        currentEmotion: 'Confident',
                        currentEmotionIntensity: 7
                    })
                });

                if (!response.ok) {
                    resultsDiv.innerHTML = `<div class="error">❌ API Error: ${response.status} ${response.statusText}</div>`;
                    return;
                }

                const data = await response.json();
                
                let html = '<h2>📊 Picker API Results</h2>';
                
                if (data.recommendations && data.recommendations.length > 0) {
                    html += `<p>Found ${data.recommendations.length} recommendations</p>`;
                    
                    // Check first few recommendations for dynamic values
                    const samplePicks = data.recommendations.slice(0, 3);
                    
                    samplePicks.forEach((pick, index) => {
                        html += `<div class="test-case">`;
                        html += `<h3>Pick ${index + 1}: ${pick.teams}</h3>`;
                        html += `<p><strong>Type:</strong> ${pick.betType} - ${pick.line}</p>`;
                        html += `<p><strong>Odds:</strong> ${pick.odds}</p>`;
                        html += `<p><strong>Emotional Alignment:</strong> ${pick.emotionalAlignment}%</p>`;
                        html += `<p><strong>Suggested Stake:</strong> $${pick.suggestedStakeAbsolute}</p>`;
                        html += `<p><strong>Risk Level:</strong> ${pick.riskLevel}</p>`;
                        html += `<p><strong>EV:</strong> $${pick.numericRisk?.ev || 'N/A'}</p>`;
                        
                        // Check for dynamic values
                        if (pick.emotionalAlignment && pick.emotionalAlignment !== 80) {
                            html += `<p class="success dynamic">✅ Dynamic emotional alignment: ${pick.emotionalAlignment}% (not hardcoded 80%)</p>`;
                        } else {
                            html += `<p class="warning">⚠️ Emotional alignment might be hardcoded: ${pick.emotionalAlignment}%</p>`;
                        }
                        
                        if (pick.suggestedStakeAbsolute && pick.suggestedStakeAbsolute !== 30) {
                            html += `<p class="success dynamic">✅ Dynamic stake amount: $${pick.suggestedStakeAbsolute} (not hardcoded $30)</p>`;
                        } else {
                            html += `<p class="warning">⚠️ Stake might be hardcoded: $${pick.suggestedStakeAbsolute}</p>`;
                        }
                        
                        html += `</div>`;
                    });
                    
                    // Overall assessment
                    const hasDynamicAlignment = data.recommendations.some(p => p.emotionalAlignment !== 80);
                    const hasDynamicStake = data.recommendations.some(p => p.suggestedStakeAbsolute !== 30);
                    
                    html += `<div class="test-case">`;
                    html += `<h2>🎯 Overall Assessment</h2>`;
                    
                    if (hasDynamicAlignment && hasDynamicStake) {
                        html += `<p class="success">✅ SUCCESS: Both emotional alignment and stake amounts are now dynamic!</p>`;
                    } else if (hasDynamicAlignment || hasDynamicStake) {
                        html += `<p class="warning">⚠️ PARTIAL: One of the values is dynamic, but not both.</p>`;
                    } else {
                        html += `<p class="error">❌ ISSUE: Values still appear to be hardcoded.</p>`;
                    }
                    
                    html += `</div>`;
                    
                } else {
                    html += '<p class="error">No recommendations returned from API</p>';
                }

                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Test failed: ${error.message}</div>`;
            }
        }

        // Run test when page loads
        testPickerAPI();
    </script>
</body>
</html>
