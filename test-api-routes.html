<!DOCTYPE html>
<html>
<head>
  <title>API Route Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #00ff00;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      background: #333;
      color: #00ff00;
      border: 1px solid #00ff00;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #444; }
    pre {
      background: #000;
      padding: 15px;
      border: 1px solid #00ff00;
      overflow-x: auto;
      margin: 10px 0;
    }
    .success { color: #00ff00; }
    .error { color: #ff0000; }
    .info { color: #00aaff; }
  </style>
</head>
<body>
  <h1>🧪 API Route Direct Test</h1>
  <p class="info">Make sure your dev server is running on http://localhost:3000</p>

  <button onclick="testEnhancedOddsNFL()">Test Enhanced Odds API - NFL</button>
  <button onclick="testEnhancedOddsNBA()">Test Enhanced Odds API - NBA</button>
  <button onclick="clearResults()">Clear Results</button>

  <div id="results"></div>

  <script>
    const resultsDiv = document.getElementById('results');

    function log(message, type = 'info') {
      const pre = document.createElement('pre');
      pre.className = type;
      pre.textContent = `[${new Date().toISOString()}] ${message}`;
      resultsDiv.appendChild(pre);
    }

    function clearResults() {
      resultsDiv.innerHTML = '';
    }

    async function testEnhancedOddsNFL() {
      log('🏈 Testing NFL Enhanced Odds API...', 'info');

      try {
        const url = 'http://localhost:3000/api/enhanced-odds?sport=americanfootball_nfl&strategy=auto';
        log(`Fetching: ${url}`, 'info');

        const response = await fetch(url);
        log(`Status: ${response.status} ${response.ok ? '✓ SUCCESS' : '✗ FAILED'}`, response.ok ? 'success' : 'error');

        const data = await response.json();
        log(`Response:\n${JSON.stringify(data, null, 2)}`, response.ok ? 'success' : 'error');

        if (data.data && Array.isArray(data.data)) {
          log(`✓ Found ${data.data.length} NFL games`, 'success');
          if (data.data.length > 0) {
            log(`First game: ${data.data[0].awayTeam} @ ${data.data[0].homeTeam}`, 'success');
          }
        } else {
          log('⚠ No games in response', 'error');
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }
    }

    async function testEnhancedOddsNBA() {
      log('🏀 Testing NBA Enhanced Odds API...', 'info');

      try {
        const url = 'http://localhost:3000/api/enhanced-odds?sport=basketball_nba&strategy=auto';
        log(`Fetching: ${url}`, 'info');

        const response = await fetch(url);
        log(`Status: ${response.status} ${response.ok ? '✓ SUCCESS' : '✗ FAILED'}`, response.ok ? 'success' : 'error');

        const data = await response.json();
        log(`Response:\n${JSON.stringify(data, null, 2)}`, response.ok ? 'success' : 'error');

        if (data.data && Array.isArray(data.data)) {
          log(`✓ Found ${data.data.length} NBA games`, 'success');
          if (data.data.length > 0) {
            log(`First game: ${data.data[0].awayTeam} @ ${data.data[0].homeTeam}`, 'success');
          }
        } else {
          log('⚠ No games in response', 'error');
        }
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }
    }
  </script>
</body>
</html>
