<!DOCTYPE html>
<html>
<head>
  <title>Test Supabase Connection</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Supabase Connection Test</h1>
  <button onclick="testConnection()">Test Connection</button>
  <button onclick="testAuth()">Test Auth</button>
  <button onclick="testQuery()">Test Profile Query</button>
  <pre id="output"></pre>

  <script>
    // Get these from your .env.local file
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const output = document.getElementById('output')
    
    async function testConnection() {
      output.textContent = 'Testing connection...\n'
      try {
        const { data, error } = await supabase.from('profiles').select('count')
        output.textContent += `✓ Connection successful\n`
        output.textContent += `Result: ${JSON.stringify(data, null, 2)}\n`
        if (error) output.textContent += `Error: ${JSON.stringify(error, null, 2)}\n`
      } catch (e) {
        output.textContent += `✗ Connection failed: ${e.message}\n`
      }
    }
    
    async function testAuth() {
      output.textContent = 'Testing auth...\n'
      try {
        const { data, error } = await supabase.auth.getUser()
        output.textContent += `Auth check: ${data.user ? 'Signed in' : 'Not signed in'}\n`
        if (data.user) {
          output.textContent += `User ID: ${data.user.id}\n`
          output.textContent += `Email: ${data.user.email}\n`
        }
        if (error) output.textContent += `Error: ${JSON.stringify(error, null, 2)}\n`
      } catch (e) {
        output.textContent += `✗ Auth check failed: ${e.message}\n`
      }
    }
    
    async function testQuery() {
      output.textContent = 'Testing profile query...\n'
      try {
        const { data: { user } } = await supabase.auth.getUser()
        if (!user) {
          output.textContent += 'Not signed in - sign in first\n'
          return
        }
        
        output.textContent += `Querying profiles for user ${user.id}...\n`
        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .maybeSingle()
        
        output.textContent += `Query completed!\n`
        output.textContent += `Data: ${JSON.stringify(data, null, 2)}\n`
        if (error) output.textContent += `Error: ${JSON.stringify(error, null, 2)}\n`
      } catch (e) {
        output.textContent += `✗ Query failed: ${e.message}\n`
      }
    }
  </script>
</body>
</html>
